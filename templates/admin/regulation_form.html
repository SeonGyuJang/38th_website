{% extends "base.html" %}

{% block title %}{% if regulation %}회칙 수정{% else %}회칙 추가{% endif %} - 관리자{% endblock %}

{% block content %}
<div class="container">
    <div class="admin-header">
        <h1 style="font-size: 2rem; font-weight: 700;">{% if regulation %}회칙 수정{% else %}회칙 추가{% endif %}</h1>
    </div>

    <div style="margin-bottom: var(--spacing-md);">
        <a href="{{ url_for('admin_regulations') }}" class="btn btn-secondary btn-small">← 목록으로</a>
    </div>

    <div class="content">
        <form method="POST" data-validate>
            <div class="form-group">
                <label class="form-label" for="category">카테고리 (단위) *</label>
                <input type="text" class="form-input" id="category" name="category" value="{{ regulation.category if regulation else '' }}" required placeholder="예: 총학생회, 동아리연합회">
            </div>

            <div class="form-group">
                <label class="form-label" for="title">제목 *</label>
                <input type="text" class="form-input" id="title" name="title" value="{{ regulation.title if regulation else '' }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="content">내용 *</label>
                <textarea class="form-textarea" id="content" name="content" required data-enhance>{{ regulation.content if regulation else '' }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="file_url">첨부파일 URL (전문)</label>
                <input type="url" class="form-input" id="file_url" name="file_url" value="{{ regulation.file_url if regulation else '' }}" placeholder="https://...">
            </div>

            <div class="form-group">
                <label class="form-label" for="order">정렬 순서</label>
                <input type="number" class="form-input" id="order" name="order" value="{{ regulation.order if regulation else 0 }}">
            </div>

            <div class="flex gap-2">
                <button type="submit" class="btn btn-primary">{% if regulation %}수정{% else %}추가{% endif %}</button>
                <a href="{{ url_for('admin_regulations') }}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
