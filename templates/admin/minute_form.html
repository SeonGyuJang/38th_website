{% extends "base.html" %}

{% block title %}{% if minute %}회의록 수정{% else %}회의록 추가{% endif %} - 관리자{% endblock %}

{% block content %}
<div class="container" style="padding-top: 100px; padding-bottom: 80px;">
    <div style="max-width: 800px; margin: 0 auto;">
        <!-- 헤더 -->
        <div style="margin-bottom: 40px;">
            <a href="{{ url_for('admin_minutes') }}" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 0.9rem; text-decoration: none; margin-bottom: 16px; transition: var(--transition-base);" onmouseover="this.style.color='var(--apple-blue)';" onmouseout="this.style.color='var(--text-secondary)';">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                회의록 관리로 돌아가기
            </a>
            <h1 style="font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 700; color: var(--text-primary);">
                {% if minute %}회의록 수정{% else %}회의록 추가{% endif %}
            </h1>
        </div>

        <!-- 폼 카드 -->
        <div style="background: white; border-radius: var(--radius-xl); padding: clamp(32px, 5vw, 48px); box-shadow: var(--shadow-md); border: 1px solid var(--border-light);">
            <form method="POST" enctype="multipart/form-data">
                <div style="margin-bottom: 28px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="title">
                        제목 <span style="color: var(--apple-blue);">*</span>
                    </label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ minute.title if minute else '' }}"
                        required
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                        onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        placeholder="회의록 제목을 입력하세요"
                    >
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 28px;">
                    <div>
                        <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="meeting_type">
                            회의 유형
                        </label>
                        <select
                            id="meeting_type"
                            name="meeting_type"
                            style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary); appearance: none; cursor: pointer;"
                            onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                            onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        >
                            <option value="">회의 유형 선택</option>
                            <option value="중앙운영위원회의" {% if minute and minute.meeting_type == '중앙운영위원회의' %}selected{% endif %}>중앙운영위원회의</option>
                            <option value="전체회의" {% if minute and minute.meeting_type == '전체회의' %}selected{% endif %}>전체회의</option>
                            <option value="전체학생대표자회의" {% if minute and minute.meeting_type == '전체학생대표자회의' %}selected{% endif %}>전체학생대표자회의</option>
                        </select>
                    </div>

                    <div>
                        <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="meeting_date">
                            회의 날짜 <span style="color: var(--apple-blue);">*</span>
                        </label>
                        <input
                            type="date"
                            id="meeting_date"
                            name="meeting_date"
                            value="{{ minute.meeting_date.strftime('%Y-%m-%d') if minute else '' }}"
                            required
                            style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                            onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                            onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        >
                    </div>
                </div>

                <div style="margin-bottom: 28px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="attendees">
                        참석자
                    </label>
                    <input
                        type="text"
                        id="attendees"
                        name="attendees"
                        value="{{ minute.attendees if minute else '' }}"
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                        onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        placeholder="이름을 쉼표로 구분하여 입력하세요"
                    >
                </div>

                <div style="margin-bottom: 28px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="agenda">
                        안건
                    </label>
                    <textarea
                        id="agenda"
                        name="agenda"
                        rows="4"
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary); resize: vertical; font-family: 'Pretendard', -apple-system, sans-serif;"
                        onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        placeholder="회의 안건을 입력하세요"
                    >{{ minute.agenda if minute else '' }}</textarea>
                </div>

                <div style="margin-bottom: 28px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="content">
                        회의 내용 <span style="color: var(--apple-blue);">*</span>
                    </label>
                    <textarea
                        id="content"
                        name="content"
                        rows="10"
                        required
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary); resize: vertical; font-family: 'Pretendard', -apple-system, sans-serif;"
                        onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        placeholder="회의 내용을 상세히 입력하세요"
                    >{{ minute.content if minute else '' }}</textarea>
                </div>

                <div style="margin-bottom: 28px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="decisions">
                        결정사항
                    </label>
                    <textarea
                        id="decisions"
                        name="decisions"
                        rows="4"
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary); resize: vertical; font-family: 'Pretendard', -apple-system, sans-serif;"
                        onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        placeholder="회의 결정사항을 입력하세요"
                    >{{ minute.decisions if minute else '' }}</textarea>
                </div>

                <div style="background: var(--bg-secondary); padding: clamp(20px, 4vw, 28px); border-radius: var(--radius-lg); margin-bottom: 32px; border: 2px dashed var(--border-color);">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 14px;">
                        첨부파일 (PDF, DOCX, HWP 등)
                    </label>
                    <input
                        type="file"
                        name="file"
                        style="width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: var(--radius-md); background: white; cursor: pointer; font-family: 'Pretendard', -apple-system, sans-serif;"
                    >
                    {% if minute and minute.file_url %}
                    <div style="margin-top: 14px; padding: 12px; background: white; border-radius: var(--radius-md); font-size: 0.9rem;">
                        현재 파일: <a href="{{ minute.file_url }}" target="_blank" style="color: var(--apple-blue); font-weight: 600; text-decoration: none;" onmouseover="this.style.textDecoration='underline';" onmouseout="this.style.textDecoration='none';">다운로드</a>
                    </div>
                    {% endif %}

                    <div style="margin-top: 16px; padding-top: 16px; border-top: 2px dashed var(--border-color);">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px;">
                            또는 외부 URL 직접 입력
                        </label>
                        <input
                            type="url"
                            name="file_url_text"
                            value="{{ minute.file_url if minute and minute.file_url and minute.file_url.startswith('http') and not minute.file_url.startswith('/') else '' }}"
                            style="width: 100%; padding: 12px 14px; font-size: 0.95rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: white;"
                            onfocus="this.style.borderColor='var(--apple-blue)';"
                            onblur="this.style.borderColor='var(--border-color)';"
                            placeholder="https://..."
                        >
                    </div>
                </div>

                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button
                        type="submit"
                        style="flex: 1; min-width: 140px; padding: 16px 32px; background: linear-gradient(135deg, var(--apple-blue) 0%, var(--apple-blue-dark) 100%); color: white; border: none; border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; cursor: pointer; transition: var(--transition-base); box-shadow: 0 4px 12px rgba(150, 26, 50, 0.2);"
                        onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(150, 26, 50, 0.3)';"
                        onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(150, 26, 50, 0.2)';"
                    >
                        {% if minute %}수정하기{% else %}추가하기{% endif %}
                    </button>
                    <a
                        href="{{ url_for('admin_minutes') }}"
                        style="flex: 1; min-width: 140px; padding: 16px 32px; background: var(--bg-secondary); color: var(--text-primary); border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; text-align: center; text-decoration: none; transition: var(--transition-base); display: inline-block;"
                        onmouseover="this.style.background='var(--border-color)';"
                        onmouseout="this.style.background='var(--bg-secondary)';"
                    >
                        취소
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
