{% extends "base.html" %}

{% block title %}{% if regulation %}회칙 수정{% else %}회칙 추가{% endif %} - 관리자{% endblock %}

{% block content %}
<div class="container" style="padding-top: 100px;">
    <h1 class="section-title">{% if regulation %}회칙 수정{% else %}회칙 추가{% endif %}</h1>

    <form method="POST" enctype="multipart/form-data" style="max-width: 800px; margin: 0 auto;">
        <div class="form-group">
            <label class="form-label">카테고리</label>
            <input type="text" class="form-input" name="category" value="{{ regulation.category if regulation else '' }}" required placeholder="예: 총학생회, 동아리연합회">
        </div>

        <div class="form-group">
            <label class="form-label">제목</label>
            <input type="text" class="form-input" name="title" value="{{ regulation.title if regulation else '' }}" required>
        </div>

        <div class="form-group">
            <label class="form-label">내용 (요약 또는 조항)</label>
            <textarea class="form-textarea" name="content" rows="10" required>{{ regulation.content if regulation else '' }}</textarea>
        </div>

        <div class="form-group" style="background: var(--bg-secondary); padding: 24px; border-radius: 16px;">
            <label class="form-label">전문 파일 (PDF 권장)</label>
            <input type="file" name="file" class="file-input">
            {% if regulation and regulation.file_url %}
            <div style="margin-top: 10px; font-size: 0.9rem;">
                현재 파일: <a href="{{ regulation.file_url }}" target="_blank" style="color: var(--korea-crimson); font-weight: 600;">다운로드</a>
            </div>
            {% endif %}
            
            <div style="margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 15px;">
                <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary);">또는 외부 URL 직접 입력</label>
                <input type="url" class="form-input" name="file_url_text" value="{{ regulation.file_url if regulation and regulation.file_url.startswith('http') and not regulation.file_url.startswith('/') else '' }}" placeholder="https://...">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">정렬 순서</label>
            <input type="number" class="form-input" name="order" value="{{ regulation.order if regulation else 0 }}">
        </div>

        <div style="margin-top: 40px; display: flex; gap: 15px;">
            <button type="submit" class="btn btn-primary">저장하기</button>
            <a href="{{ url_for('admin_regulations') }}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
{% endblock %}
