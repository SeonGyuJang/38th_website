{% extends "base.html" %}

{% block title %}공약 진행상황 추가 - 관리자{% endblock %}

{% block content %}
<div class="container">
    <div class="admin-header">
        <h1 style="font-size: 2rem; font-weight: 700;">공약 진행상황 추가</h1>
        <p style="opacity: 0.9;">{{ promise.title }}</p>
    </div>

    <div style="margin-bottom: var(--spacing-md);">
        <a href="{{ url_for('admin_promises') }}" class="btn btn-secondary btn-small">← 목록으로</a>
    </div>

    <div class="content">
        <form method="POST" data-validate>
            <div class="form-group">
                <label class="form-label" for="title">제목 *</label>
                <input type="text" class="form-input" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="date">날짜 *</label>
                <input type="date" class="form-input" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="content">내용 *</label>
                <textarea class="form-textarea" id="content" name="content" required data-enhance></textarea>
            </div>

            <div class="flex gap-2">
                <button type="submit" class="btn btn-primary">추가</button>
                <a href="{{ url_for('admin_promises') }}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
