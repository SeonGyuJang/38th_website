<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - 고려대학교(세종) 제38대 총학생회</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='defaults/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #fafafa 0%, #f5f5f7 50%, #e8e8ed 100%); padding: 20px; position: relative; overflow: hidden;">
    <!-- 배경 패턴 -->
    <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(circle at 20% 80%, rgba(150, 26, 50, 0.05) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(0, 122, 255, 0.05) 0%, transparent 50%); pointer-events: none;"></div>

    <div style="max-width: 460px; width: 100%; position: relative; z-index: 1;">
        <!-- 로고 및 헤더 -->
        <div style="text-align: center; margin-bottom: 40px; animation: fadeInUp 0.6s ease-out;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 88px; height: 88px; background: linear-gradient(135deg, var(--ku-crimson) 0%, var(--ku-crimson-dark) 100%); border-radius: 24px; margin-bottom: 24px; box-shadow: 0 12px 40px rgba(150, 26, 50, 0.3); position: relative;">
                <span style="font-size: 2.75rem;">🔐</span>
                <div style="position: absolute; top: -4px; right: -4px; width: 24px; height: 24px; background: linear-gradient(135deg, #FF3B30 0%, #FF6B22 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255, 59, 48, 0.4);">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="white">
                        <path d="M8 2C9.1 2 10 2.9 10 4C10 5.1 9.1 6 8 6C6.9 6 6 5.1 6 4C6 2.9 6.9 2 8 2ZM8 12C10.7 12 13.8 13.29 14 14H2C2.23 13.28 5.31 12 8 12ZM8 0C5.79 0 4 1.79 4 4C4 6.21 5.79 8 8 8C10.21 8 12 6.21 12 4C12 1.79 10.21 0 8 0ZM8 10C5.33 10 0 11.34 0 14V16H16V14C16 11.34 10.67 10 8 10Z"/>
                    </svg>
                </div>
            </div>
            <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; letter-spacing: -0.02em;">
                관리자 로그인
            </h1>
            <p style="color: var(--text-secondary); font-size: 1rem; font-weight: 500;">고려대학교 38대 총학생회 비범</p>
        </div>

        <!-- 로그인 카드 -->
        <div style="background: white; border-radius: 24px; padding: clamp(36px, 5vw, 44px); box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08); border: 1px solid rgba(0, 0, 0, 0.04); animation: fadeInUp 0.6s ease-out 0.1s backwards;">
            {% set messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ 'flash-error' if category == 'error' else 'flash-success' }}" style="margin-bottom: 28px; border-radius: 14px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{{ url_for('admin_login') }}">
                <div style="margin-bottom: 24px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 700; color: var(--text-primary); margin-bottom: 10px;" for="username">
                        아이디
                    </label>
                    <div style="position: relative;">
                        <div style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); pointer-events: none;">
                            <svg width="18" height="18" viewBox="0 0 16 16" fill="var(--text-secondary)" opacity="0.5">
                                <path d="M8 8c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>
                        </div>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            autofocus
                            placeholder="아이디를 입력하세요"
                            style="width: 100%; padding: 16px 16px 16px 48px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: 14px; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); background: var(--bg-secondary); font-weight: 500;"
                            onfocus="this.style.borderColor='var(--ku-crimson)'; this.style.background='white'; this.style.boxShadow='0 4px 20px rgba(150, 26, 50, 0.1)';"
                            onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)'; this.style.boxShadow='none';"
                        >
                    </div>
                </div>

                <div style="margin-bottom: 32px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 700; color: var(--text-primary); margin-bottom: 10px;" for="password">
                        비밀번호
                    </label>
                    <div style="position: relative;">
                        <div style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); pointer-events: none;">
                            <svg width="18" height="18" viewBox="0 0 16 16" fill="var(--text-secondary)" opacity="0.5">
                                <path d="M12 7V5c0-2.21-1.79-4-4-4S4 2.79 4 5v2c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM6 5c0-1.1.9-2 2-2s2 .9 2 2v2H6V5zm3 9c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1s1 .45 1 1v2c0 .55-.45 1-1 1z"/>
                            </svg>
                        </div>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="비밀번호를 입력하세요"
                            style="width: 100%; padding: 16px 16px 16px 48px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: 14px; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); background: var(--bg-secondary); font-weight: 500;"
                            onfocus="this.style.borderColor='var(--ku-crimson)'; this.style.background='white'; this.style.boxShadow='0 4px 20px rgba(150, 26, 50, 0.1)';"
                            onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)'; this.style.boxShadow='none';"
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    style="width: 100%; padding: 18px; background: linear-gradient(135deg, var(--ku-crimson) 0%, var(--ku-crimson-dark) 100%); color: white; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 6px 20px rgba(150, 26, 50, 0.3); letter-spacing: 0.02em;"
                    onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 10px 30px rgba(150, 26, 50, 0.4)';"
                    onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 6px 20px rgba(150, 26, 50, 0.3)';"
                >
                    로그인
                </button>
            </form>
        </div>

        <!-- 하단 링크 -->
        <div style="text-align: center; margin-top: 28px; animation: fadeInUp 0.6s ease-out 0.2s backwards;">
            <a href="{{ url_for('index') }}" style="display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 0.95rem; text-decoration: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); padding: 10px 20px; border-radius: 100px; font-weight: 600;" onmouseover="this.style.color='var(--ku-crimson)'; this.style.background='rgba(150, 26, 50, 0.05)';" onmouseout="this.style.color='var(--text-secondary)'; this.style.background='transparent';">
                <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
                    <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                홈으로 돌아가기
            </a>
        </div>
    </div>

    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
