<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버스 예약 - 고려대학교(세종) 제38대 총학생회</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='defaults/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at top, rgba(150, 26, 50, 0.12), transparent 55%), linear-gradient(160deg, #fafafa 0%, #f7f3ef 45%, #f1e9df 100%); padding: 24px; position: relative;">
    <!-- 배경 패턴 -->
    <div style="position: absolute; inset: 0; background-image: radial-gradient(circle at 15% 20%, rgba(150, 26, 50, 0.08), transparent 55%), radial-gradient(circle at 85% 75%, rgba(255, 193, 7, 0.12), transparent 60%); pointer-events: none;"></div>

    <div style="max-width: 640px; width: 100%; position: relative; z-index: 1; text-align: center; margin: auto;">
        <div style="background: white; border-radius: 28px; padding: clamp(20px, 5vw, 36px); box-shadow: 0 24px 60px rgba(29, 22, 13, 0.12); border: 1px solid rgba(122, 30, 47, 0.08); animation: fadeInUp 0.6s ease-out;">
            <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                <img src="{{ url_for('static', filename='defaults/fix.gif') }}" alt="준비 중 이미지" style="max-width: min(360px, 80%); width: 100%; height: auto;">
            </div>
            <h1 id="notOpenTitle" style="width: 100%; white-space: nowrap; font-size: 2rem; font-weight: 800; color: #1a1a1a; margin: 0 0 14px 0; letter-spacing: -0.02em;">
                아직 오픈되지 않았습니다.
            </h1>
            <div style="display: grid; gap: 2px; color: #555; font-weight: 600; margin-bottom: 8px;">
                <div id="notOpenLine1" style="width: 100%; white-space: nowrap; font-size: 1rem;">예약 오픈 일정은 추후 공지사항 및 SNS를 통해</div>
                <div id="notOpenLine2" style="width: 100%; white-space: nowrap; font-size: 1rem;">안내드릴 예정입니다!</div>
            </div>
            <div style="padding-top: 8px;">
                <a href="{{ url_for('index') }}" style="display: inline-flex; align-items: center; gap: 8px; padding: 11px 26px; background: #7A1E2F; color: white; text-decoration: none; border-radius: 999px; font-weight: 700; font-size: 0.9rem; box-shadow: 0 8px 20px rgba(122, 30, 47, 0.35); transition: all 0.2s;" onmouseover="this.style.transform='translateY(-2px)';" onmouseout="this.style.transform='translateY(0)';">
                    홈으로
                </a>
            </div>
        </div>
    </div>

    <style>
        @media (max-height: 700px) {
            body { align-items: flex-start; padding-top: 32px; padding-bottom: 32px; }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script>
        // 컨테이너 폭에 맞춰 지정된 텍스트가 항상 한 줄로 보이도록 폰트 크기를 줄여준다.
        function fitTextToOneLine(el, maxSize, minSize) {
            if (!el) return;
            let size = maxSize;
            el.style.fontSize = size + 'px';
            while (el.scrollWidth > el.clientWidth && size > minSize) {
                size -= 1;
                el.style.fontSize = size + 'px';
            }
        }

        function fitAllOneLiners() {
            fitTextToOneLine(document.getElementById('notOpenTitle'), 32, 14);
            fitTextToOneLine(document.getElementById('notOpenLine1'), 16, 10);
            fitTextToOneLine(document.getElementById('notOpenLine2'), 16, 10);
        }

        fitAllOneLiners();
        window.addEventListener('resize', fitAllOneLiners);
        window.addEventListener('orientationchange', fitAllOneLiners);
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(fitAllOneLiners);
        }
    </script>
</body>
</html>
