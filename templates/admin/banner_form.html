{% extends "base.html" %}

{% block title %}{% if banner %}배너 수정{% else %}배너 추가{% endif %} - 관리자{% endblock %}

{% block content %}
<div class="container" style="padding-top: 100px; padding-bottom: 80px;">
    <div style="max-width: 800px; margin: 0 auto;">
        <!-- 헤더 -->
        <div style="margin-bottom: 40px;">
            <a href="{{ url_for('admin_banners') }}" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 0.9rem; text-decoration: none; margin-bottom: 16px; transition: var(--transition-base);" onmouseover="this.style.color='var(--korea-crimson)';" onmouseout="this.style.color='var(--text-secondary)';">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                배너 관리로 돌아가기
            </a>
            <h1 style="font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 700; color: var(--text-primary);">
                {% if banner %}배너 수정{% else %}배너 추가{% endif %}
            </h1>
        </div>

        <!-- 폼 카드 -->
        <div style="background: white; border-radius: var(--radius-xl); padding: clamp(32px, 5vw, 48px); box-shadow: var(--shadow-md); border: 1px solid var(--border-light);">
            <form method="POST" enctype="multipart/form-data">
                <div style="margin-bottom: 28px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="title">
                        배너 제목 <span style="color: var(--korea-crimson);">*</span>
                    </label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ banner.title if banner else '' }}"
                        required
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                        onfocus="this.style.borderColor='var(--korea-crimson)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        placeholder="배너 제목을 입력하세요"
                    >
                </div>

                <div style="margin-bottom: 28px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="link">
                        링크 URL (클릭 시 이동)
                    </label>
                    <input
                        type="url"
                        id="link"
                        name="link"
                        value="{{ banner.link if banner else '' }}"
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                        onfocus="this.style.borderColor='var(--korea-crimson)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        placeholder="https://..."
                    >
                </div>

                <div style="background: var(--bg-secondary); padding: clamp(20px, 4vw, 28px); border-radius: var(--radius-lg); margin-bottom: 28px; border: 2px dashed var(--border-color);">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 14px;">
                        배너 이미지 (1920x600 권장)
                    </label>
                    <input
                        type="file"
                        name="image"
                        accept="image/*"
                        style="width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: var(--radius-md); background: white; cursor: pointer; font-family: 'Pretendard', -apple-system, sans-serif;"
                    >
                    {% if banner and banner.image_url %}
                    <div style="margin-top: 16px;">
                        <img src="{{ banner.image_url }}" style="width: 100%; border-radius: var(--radius-md); box-shadow: var(--shadow-sm);">
                    </div>
                    {% endif %}

                    <div style="margin-top: 16px; padding-top: 16px; border-top: 2px dashed var(--border-color);">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px;">
                            또는 이미지 URL 직접 입력
                        </label>
                        <input
                            type="url"
                            name="image_url_text"
                            value="{{ banner.image_url if banner and banner.image_url.startswith('http') and not banner.image_url.startswith('/') else '' }}"
                            style="width: 100%; padding: 12px 14px; font-size: 0.95rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: white;"
                            onfocus="this.style.borderColor='var(--korea-crimson)';"
                            onblur="this.style.borderColor='var(--border-color)';"
                            placeholder="https://..."
                        >
                    </div>
                </div>

                <div style="background: var(--bg-secondary); padding: 20px; border-radius: var(--radius-md); margin-bottom: 28px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 16px;">
                        옵션
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 14px;">
                        <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 12px; background: white; border-radius: var(--radius-md); border: 2px solid var(--border-color); transition: var(--transition-base);" onmouseover="this.style.borderColor='var(--korea-crimson)';" onmouseout="this.style.borderColor='var(--border-color)';">
                            <input type="checkbox" name="is_active" {% if not banner or banner.is_active %}checked{% endif %} style="width: 20px; height: 20px; cursor: pointer; accent-color: var(--korea-crimson);">
                            <span style="font-weight: 600; font-size: 0.95rem;">활성화</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 12px; background: white; border-radius: var(--radius-md); border: 2px solid var(--border-color); transition: var(--transition-base);" onmouseover="this.style.borderColor='var(--korea-crimson)';" onmouseout="this.style.borderColor='var(--border-color)';">
                            <input type="checkbox" name="is_event_banner" {% if banner and banner.is_event_banner %}checked{% endif %} style="width: 20px; height: 20px; cursor: pointer; accent-color: var(--korea-crimson);">
                            <span style="font-weight: 600; font-size: 0.95rem;">이벤트 배너 (우선 노출)</span>
                        </label>
                    </div>
                </div>

                <div style="margin-bottom: 32px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="order">
                        정렬 순서
                    </label>
                    <input
                        type="number"
                        id="order"
                        name="order"
                        value="{{ banner.order if banner else 0 }}"
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                        onfocus="this.style.borderColor='var(--korea-crimson)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        placeholder="작을수록 먼저 표시됩니다"
                    >
                </div>

                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button
                        type="submit"
                        style="flex: 1; min-width: 140px; padding: 16px 32px; background: linear-gradient(135deg, var(--korea-crimson) 0%, var(--korea-crimson-dark) 100%); color: white; border: none; border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; cursor: pointer; transition: var(--transition-base); box-shadow: 0 4px 12px rgba(150, 26, 50, 0.2);"
                        onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(150, 26, 50, 0.3)';"
                        onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(150, 26, 50, 0.2)';"
                    >
                        {% if banner %}수정하기{% else %}추가하기{% endif %}
                    </button>
                    <a
                        href="{{ url_for('admin_banners') }}"
                        style="flex: 1; min-width: 140px; padding: 16px 32px; background: var(--bg-secondary); color: var(--text-primary); border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; text-align: center; text-decoration: none; transition: var(--transition-base); display: inline-block;"
                        onmouseover="this.style.background='var(--border-color)';"
                        onmouseout="this.style.background='var(--bg-secondary)';"
                    >
                        취소
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
