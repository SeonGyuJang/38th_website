<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - 고려대학교 38대 총학생회</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%); padding: 20px;">
    <div style="max-width: 440px; width: 100%;">
        <!-- 로고 및 헤더 -->
        <div style="text-align: center; margin-bottom: 48px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; background: linear-gradient(135deg, var(--korea-crimson) 0%, var(--korea-crimson-dark) 100%); border-radius: 22px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(150, 26, 50, 0.25);">
                <span style="font-size: 2.5rem;">🎓</span>
            </div>
            <h1 style="font-size: 1.75rem; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;">
                관리자 로그인
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.95rem;">고려대학교 38대 총학생회</p>
        </div>

        <!-- 로그인 카드 -->
        <div style="background: white; border-radius: var(--radius-xl); padding: clamp(32px, 5vw, 40px); box-shadow: var(--shadow-lg); border: 1px solid var(--border-light);">
            {% set messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ 'flash-error' if category == 'error' else 'flash-success' }}" style="margin-bottom: 24px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{{ url_for('admin_login') }}">
                <div style="margin-bottom: 24px;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;" for="username">
                        아이디
                    </label>
                    <input
                        type="text"
                        class="form-input"
                        id="username"
                        name="username"
                        required
                        autofocus
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                        onfocus="this.style.borderColor='var(--korea-crimson)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                    >
                </div>

                <div style="margin-bottom: 32px;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;" for="password">
                        비밀번호
                    </label>
                    <input
                        type="password"
                        class="form-input"
                        id="password"
                        name="password"
                        required
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                        onfocus="this.style.borderColor='var(--korea-crimson)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                    >
                </div>

                <button
                    type="submit"
                    style="width: 100%; padding: 16px; background: linear-gradient(135deg, var(--korea-crimson) 0%, var(--korea-crimson-dark) 100%); color: white; border: none; border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; cursor: pointer; transition: var(--transition-base); box-shadow: 0 4px 12px rgba(150, 26, 50, 0.2);"
                    onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(150, 26, 50, 0.3)';"
                    onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(150, 26, 50, 0.2)';"
                >
                    로그인
                </button>
            </form>
        </div>

        <!-- 하단 링크 -->
        <div style="text-align: center; margin-top: 24px;">
            <a href="{{ url_for('index') }}" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 0.9rem; text-decoration: none; transition: var(--transition-base);" onmouseover="this.style.color='var(--korea-crimson)';" onmouseout="this.style.color='var(--text-secondary)';">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="opacity: 0.7;">
                    <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                홈으로 돌아가기
            </a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
