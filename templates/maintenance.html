<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈페이지 수정 작업 중 - 고려대학교 38대 총학생회</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='defaults/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at top, rgba(150, 26, 50, 0.12), transparent 55%), linear-gradient(160deg, #fafafa 0%, #f7f3ef 45%, #f1e9df 100%); padding: 32px; position: relative; overflow: hidden;">
    <!-- 배경 패턴 -->
    <div style="position: absolute; inset: 0; background-image: radial-gradient(circle at 15% 20%, rgba(150, 26, 50, 0.08), transparent 55%), radial-gradient(circle at 85% 75%, rgba(255, 193, 7, 0.12), transparent 60%); pointer-events: none;"></div>

    <div style="max-width: 720px; width: 100%; position: relative; z-index: 1; text-align: center;">
        <div style="background: white; border-radius: 28px; padding: clamp(24px, 5vw, 36px); box-shadow: 0 24px 60px rgba(29, 22, 13, 0.12); border: 1px solid rgba(122, 30, 47, 0.08); animation: fadeInUp 0.6s ease-out;">
            <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 18px;">
                <img src="{{ url_for('static', filename='defaults/fix.gif') }}" alt="점검 이미지" style="max-width: min(520px, 90%); width: 100%; height: auto;">
            </div>
            <h1 style="font-size: clamp(1.8rem, 4vw, 2.2rem); font-weight: 800; color: #1a1a1a; margin: 0 0 16px 0; letter-spacing: -0.02em;">
                현재 홈페이지 점검 중입니다
            </h1>
            <div style="display: grid; gap: 8px; font-size: 0.95rem; color: #555; font-weight: 600; margin-bottom: 20px;">
                <div>더 나은 홈페이지를 위해 잠시 점검 중이에요. <br> 불편하시겠지만 조금만 기다려 주세요!</div>
            </div>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 20px;">
                <a href="https://www.instagram.com/kus_bibeom_38th/" target="_blank" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: white; border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 999px; color: #333; text-decoration: none; font-weight: 600; font-size: 0.9rem;">
                    <img src="{{ url_for('static', filename='defaults/icons/instagram.svg') }}" alt="Instagram" style="width: 18px; height: 18px;">
                    인스타그램
                </a>
                <a href="https://open.kakao.com/o/sT7D1ALg" target="_blank" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: white; border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 999px; color: #333; text-decoration: none; font-weight: 600; font-size: 0.9rem;">
                    <img src="{{ url_for('static', filename='defaults/icons/kakao.svg') }}" alt="KakaoTalk" style="width: 18px; height: 18px;">
                    카카오톡
                </a>
                <button type="button" id="contact-modal-open" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: #7A1E2F; border: 1px solid #7A1E2F; border-radius: 999px; color: white; font-weight: 600; font-size: 0.9rem; cursor: pointer;">
                    홈페이지 문의
                </button>
            </div>
            <div style="border-top: 1px solid rgba(0, 0, 0, 0.08); padding-top: 16px;">
                <a href="{{ url_for('admin_login') }}" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: #7A1E2F; color: white; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; box-shadow: 0 8px 20px rgba(122, 30, 47, 0.35); transition: all 0.2s;" onmouseover="this.style.transform='translateY(-2px)';" onmouseout="this.style.transform='translateY(0)';">
                    관리자 로그인
                </a>
            </div>
        </div>
    </div>

    <div id="contact-modal" style="position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 10;">
        <div style="background: white; border-radius: 20px; max-width: 420px; width: 100%; padding: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                <h2 style="font-size: 1.1rem; font-weight: 800; color: #1a1a1a; margin: 0;">홈페이지 개발자 정보</h2>
                <button type="button" id="contact-modal-close" style="background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: #666;">×</button>
            </div>
            <div style="display: grid; gap: 10px; font-size: 0.95rem; color: #444; font-weight: 600;">
                <div>소속: 부총학생회장</div>
                <div>이메일: <a href="mailto:dsng3419@korea.ac.kr" style="color: #444; text-decoration: none;">dsng3419@korea.ac.kr</a></div>
                <div>전화번호: 010-6598-6414</div>
                <div>문의 가능 시간: 평일 09:00 - 18:00</div>
            </div>
        </div>
    </div>

    <style>
        @media (max-width: 720px) {
            body {
                padding: 24px;
            }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script>
        const contactModal = document.getElementById('contact-modal');
        const contactModalOpen = document.getElementById('contact-modal-open');
        const contactModalClose = document.getElementById('contact-modal-close');

        contactModalOpen.addEventListener('click', () => {
            contactModal.style.display = 'flex';
        });

        contactModalClose.addEventListener('click', () => {
            contactModal.style.display = 'none';
        });

        contactModal.addEventListener('click', (event) => {
            if (event.target === contactModal) {
                contactModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
