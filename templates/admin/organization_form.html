{% extends "base.html" %}

{% block title %}멤버 {% if member %}수정{% else %}추가{% endif %} - 관리자{% endblock %}

{% block content %}
<div class="container" style="padding-top: 100px; padding-bottom: 80px;">
    <div style="max-width: 800px; margin: 0 auto;">
        <!-- 헤더 -->
        <div style="margin-bottom: 40px;">
            <a href="{{ url_for('admin_organization') }}" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 0.9rem; text-decoration: none; margin-bottom: 16px; transition: var(--transition-base);" onmouseover="this.style.color='var(--apple-blue)';" onmouseout="this.style.color='var(--text-secondary)';">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                조직도 관리로 돌아가기
            </a>
            <h1 style="font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 700; color: var(--text-primary);">
                멤버 {% if member %}수정{% else %}추가{% endif %}
            </h1>
        </div>

        <!-- 폼 카드 -->
        <div style="background: white; border-radius: var(--radius-xl); padding: clamp(32px, 5vw, 48px); box-shadow: var(--shadow-md); border: 1px solid var(--border-light);">
            <form method="POST" enctype="multipart/form-data">
                <div style="margin-bottom: 28px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="name">
                        이름 <span style="color: var(--apple-blue);">*</span>
                    </label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ member.name if member else '' }}"
                        required
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                        onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        placeholder="이름을 입력하세요"
                    >
                </div>

                <div style="margin-bottom: 28px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="position">
                        직책 <span style="color: var(--apple-blue);">*</span>
                    </label>
                    <input
                        type="text"
                        id="position"
                        name="position"
                        value="{{ member.position if member else '' }}"
                        required
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                        onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        placeholder="예: 총학생회장, 기획국장"
                    >
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 28px;">
                    <div>
                        <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="department">
                            부서
                        </label>
                        <select
                            id="department"
                            name="department"
                            style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary); cursor: pointer;"
                            onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                            onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        >
                            <option value="">선택하세요</option>
                            <option value="회장단" {% if member and member.department == '회장단' %}selected{% endif %}>회장단</option>
                            <option value="본부" {% if member and member.department == '본부' %}selected{% endif %}>본부</option>
                            <option value="산하위원회" {% if member and member.department == '산하위원회' %}selected{% endif %}>산하위원회</option>
                            <option value="중앙집행위원회 미디어소통국" {% if member and member.department == '중앙집행위원회 미디어소통국' %}selected{% endif %}>중앙집행위원회 미디어소통국</option>
                            <option value="중앙집행위원회 사무국" {% if member and member.department == '중앙집행위원회 사무국' %}selected{% endif %}>중앙집행위원회 사무국</option>
                            <option value="중앙집행위원회 재정국" {% if member and member.department == '중앙집행위원회 재정국' %}selected{% endif %}>중앙집행위원회 재정국</option>
                            <option value="기획정책위원회 문화기획국" {% if member and member.department == '기획정책위원회 문화기획국' %}selected{% endif %}>기획정책위원회 문화기획국</option>
                            <option value="기획정책위원회 대외협력국" {% if member and member.department == '기획정책위원회 대외협력국' %}selected{% endif %}>기획정책위원회 대외협력국</option>
                            <option value="기획정책위원회 정책국" {% if member and member.department == '기획정책위원회 정책국' %}selected{% endif %}>기획정책위원회 정책국</option>
                            <option value="인복위_홍보국" {% if member and member.department == '인복위_홍보국' or member.department == '인권복지위원회 홍보국' %}selected{% endif %}>인권복지위원회 홍보국</option>
                            <option value="인복위_기획국" {% if member and member.department == '인복위_기획국' or member.department == '인권복지위원회 기획국' %}selected{% endif %}>인권복지위원회 기획국</option>
                            <option value="인복위_사무재정국" {% if member and member.department == '인복위_사무재정국' or member.department == '인권복지위원회 사무재정국' %}selected{% endif %}>인권복지위원회 사무재정국</option>
                            <option value="교복위_홍보국" {% if member and member.department == '교복위_홍보국' or member.department == '교육복지위원회 홍보국' %}selected{% endif %}>교육복지위원회 홍보국</option>
                            <option value="교복위_기획국" {% if member and member.department == '교복위_기획국' or member.department == '교육복지위원회 기획국' %}selected{% endif %}>교육복지위원회 기획국</option>
                            <option value="교복위_사무재정국" {% if member and member.department == '교복위_사무재정국' or member.department == '교육복지위원회 사무재정국' %}selected{% endif %}>교육복지위원회 사무재정국</option>
                        </select>
                    </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 28px;">
                    <div>
                        <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="student_id">
                            학번
                        </label>
                        <input
                            type="text"
                            id="student_id"
                            name="student_id"
                            value="{{ member.student_id if member else '' }}"
                            style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                            onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                            onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                            placeholder="예: 2020123456"
                        >
                    </div>

                    <div>
                        <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="major">
                            전공
                        </label>
                        <input
                            type="text"
                            id="major"
                            name="major"
                            value="{{ member.major if member else '' }}"
                            style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                            onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                            onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                            placeholder="예: 컴퓨터공학과"
                        >
                    </div>
                </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 28px;">
                    <div>
                        <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="phone">
                            전화번호
                        </label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            value="{{ member.phone if member else '' }}"
                            style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                            onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                            onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                            placeholder="예: 010-1234-5678"
                        >
                    </div>

                    <div>
                        <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="email">
                            이메일
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            value="{{ member.email if member else '' }}"
                            style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                            onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                            onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                            placeholder="예: example@ku.edu"
                        >
                    </div>
                </div>

                <div style="background: var(--bg-secondary); padding: clamp(20px, 4vw, 28px); border-radius: var(--radius-lg); margin-bottom: 28px; border: 2px dashed var(--border-color);">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 14px;">
                        프로필 사진
                    </label>
                    <input
                        type="file"
                        name="photo"
                        accept="image/*"
                        style="width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: var(--radius-md); background: white; cursor: pointer; font-family: 'Pretendard', -apple-system, sans-serif;"
                    >
                    {% if member and member.photo_url %}
                    <div style="margin-top: 16px; text-align: center;">
                        <img src="{{ member.photo_url }}" style="width: 120px; height: 120px; object-fit: cover; border-radius: 50%; box-shadow: var(--shadow-md); border: 3px solid white;">
                    </div>
                    {% endif %}

                    <div style="margin-top: 16px; padding-top: 16px; border-top: 2px dashed var(--border-color);">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px;">
                            또는 URL 직접 입력
                        </label>
                        <input
                            type="url"
                            name="photo_url_text"
                            value="{{ member.photo_url if member and member.photo_url and member.photo_url.startswith('http') else '' }}"
                            style="width: 100%; padding: 12px 14px; font-size: 0.95rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: white;"
                            onfocus="this.style.borderColor='var(--apple-blue)';"
                            onblur="this.style.borderColor='var(--border-color)';"
                            placeholder="https://..."
                        >
                    </div>
                </div>

                <div style="margin-bottom: 32px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;" for="order">
                        순서
                    </label>
                    <input
                        type="number"
                        id="order"
                        name="order"
                        value="{{ member.order if member else 0 }}"
                        style="width: 100%; padding: 14px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); transition: var(--transition-base); background: var(--bg-secondary);"
                        onfocus="this.style.borderColor='var(--apple-blue)'; this.style.background='white';"
                        onblur="this.style.borderColor='var(--border-color)'; this.style.background='var(--bg-secondary)';"
                        placeholder="작을수록 먼저 표시됩니다"
                    >
                </div>

                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button
                        type="submit"
                        style="flex: 1; min-width: 140px; padding: 16px 32px; background: linear-gradient(135deg, var(--apple-blue) 0%, var(--apple-blue-dark) 100%); color: white; border: none; border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; cursor: pointer; transition: var(--transition-base); box-shadow: 0 4px 12px rgba(150, 26, 50, 0.2);"
                        onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(150, 26, 50, 0.3)';"
                        onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(150, 26, 50, 0.2)';"
                    >
                        {% if member %}수정하기{% else %}추가하기{% endif %}
                    </button>
                    <a
                        href="{{ url_for('admin_organization') }}"
                        style="flex: 1; min-width: 140px; padding: 16px 32px; background: var(--bg-secondary); color: var(--text-primary); border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; text-align: center; text-decoration: none; transition: var(--transition-base); display: inline-block;"
                        onmouseover="this.style.background='var(--border-color)';"
                        onmouseout="this.style.background='var(--bg-secondary)';"
                    >
                        취소
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
