{% extends "base.html" %}

{% block title %}{% if banner %}배너 수정{% else %}배너 추가{% endif %} - 관리자{% endblock %}

{% block content %}
<div class="container" style="padding-top: 100px;">
    <h1 class="section-title">{% if banner %}배너 수정{% else %}배너 추가{% endif %}</h1>

    <form method="POST" enctype="multipart/form-data" style="max-width: 800px; margin: 0 auto;">
        <div class="form-group">
            <label class="form-label">배너 제목</label>
            <input type="text" class="form-input" name="title" value="{{ banner.title if banner else '' }}" required>
        </div>

        <div class="form-group">
            <label class="form-label">링크 URL (클릭 시 이동)</label>
            <input type="url" class="form-input" name="link" value="{{ banner.link if banner else '' }}" placeholder="https://...">
        </div>

        <div class="form-group" style="background: var(--bg-secondary); padding: 24px; border-radius: 16px;">
            <label class="form-label">배너 이미지 (1920x600 권장)</label>
            <input type="file" name="image" class="file-input" accept="image/*">
            {% if banner and banner.image_url %}
            <div style="margin-top: 15px;">
                <img src="{{ banner.image_url }}" style="width: 100%; border-radius: 8px; box-shadow: var(--shadow-sm);">
            </div>
            {% endif %}
            
            <div style="margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 15px;">
                <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary);">또는 이미지 URL 직접 입력</label>
                <input type="url" class="form-input" name="image_url_text" value="{{ banner.image_url if banner and banner.image_url.startswith('http') and not banner.image_url.startswith('/') else '' }}">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">옵션</label>
            <div style="display: flex; gap: 20px; margin-top: 10px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" name="is_active" {% if not banner or banner.is_active %}checked{% endif %} style="width: 20px; height: 20px;">
                    <span>활성화</span>
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" name="is_event_banner" {% if banner and banner.is_event_banner %}checked{% endif %} style="width: 20px; height: 20px;">
                    <span>이벤트 배너 (우선 노출)</span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">정렬 순서</label>
            <input type="number" class="form-input" name="order" value="{{ banner.order if banner else 0 }}">
        </div>

        <div style="margin-top: 40px; display: flex; gap: 15px;">
            <button type="submit" class="btn btn-primary">저장하기</button>
            <a href="{{ url_for('admin_banners') }}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
{% endblock %}
