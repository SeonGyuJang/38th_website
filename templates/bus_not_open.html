{% extends "base.html" %}

{% block title %}버스 예약 - 고려대학교 38대 총학생회{% endblock %}

{% block content %}
<style>
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="container" style="padding-top: 120px; padding-bottom: 120px; max-width: 560px;">
    <div style="background: white; border-radius: 24px; padding: 56px 40px; text-align: center; border: 1px solid #e8e8ed; box-shadow: 0 2px 16px rgba(0,0,0,0.05); animation: fadeInUp 0.5s cubic-bezier(0.16,1,0.3,1);">
        <div style="width: 72px; height: 72px; margin: 0 auto 24px; background: rgba(150,26,50,0.08); border-radius: 20px; display: flex; align-items: center; justify-content: center;">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--ku-crimson)" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/></svg>
        </div>
        <div style="display: inline-block; padding: 8px 20px; background: rgba(150,26,50,0.08); border-radius: 100px; margin-bottom: 18px; border: 1px solid rgba(150,26,50,0.15);">
            <span style="color: var(--ku-crimson); font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.78rem;">Bus Reservation</span>
        </div>
        <h1 style="font-size: clamp(1.6rem, 4vw, 2rem); font-weight: 800; color: #1a1a1a; margin: 0 0 12px 0; letter-spacing: -0.02em;">버스 예약은 아직 오픈되지 않았습니다</h1>
        <p style="color: #888; font-size: 0.95rem; line-height: 1.7; margin: 0 0 28px 0;">
            예약 오픈 일정은 추후 공지사항 및 SNS를 통해 안내드릴 예정입니다.<br>
            조금만 기다려주세요!
        </p>
        <a href="{{ url_for('index') }}" style="display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:var(--ku-crimson);border-radius:100px;color:white;font-size:0.9rem;font-weight:700;text-decoration:none;transition:all 0.2s;"
           onmouseover="this.style.background='#7a1528';" onmouseout="this.style.background='var(--ku-crimson)';">
            홈으로 돌아가기
        </a>
    </div>
</div>
{% endblock %}
