<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - 고려대학교(세종) 제38대 총학생회</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='defaults/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at top, rgba(150, 26, 50, 0.12), transparent 55%), linear-gradient(160deg, #fafafa 0%, #f7f3ef 45%, #f1e9df 100%); padding: 24px; position: relative;">
    <!-- 배경 패턴 -->
    <div style="position: absolute; inset: 0; background-image: radial-gradient(circle at 15% 20%, rgba(150, 26, 50, 0.08), transparent 55%), radial-gradient(circle at 85% 75%, rgba(255, 193, 7, 0.12), transparent 60%); pointer-events: none;"></div>

    <div style="max-width: 640px; width: 100%; position: relative; z-index: 1; text-align: center; margin: auto;">
        <div style="background: white; border-radius: 28px; padding: clamp(28px, 5vw, 48px); box-shadow: 0 24px 60px rgba(29, 22, 13, 0.12); border: 1px solid rgba(122, 30, 47, 0.08); animation: fadeInUp 0.6s ease-out;">
            <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                <img src="{{ url_for('static', filename='defaults/fix.gif') }}" alt="준비 중 이미지" style="max-width: min(320px, 80%); width: 100%; height: auto;">
            </div>
            <h1 style="font-size: 1.8rem; font-weight: 800; color: #1a1a1a; margin: 0 0 14px 0; letter-spacing: -0.02em;">
                현재 비공개된 페이지입니다.
            </h1>
            <p style="color: #555; font-weight: 600; font-size: 1rem; margin: 0 0 8px 0;">
                {{ page_title }} 페이지는 지금 준비 중이며, 곧 다시 열릴 예정입니다.
            </p>
            <div style="padding-top: 20px;">
                <a href="{{ url_for('index') }}" style="display: inline-flex; align-items: center; gap: 8px; padding: 11px 26px; background: #7A1E2F; color: white; text-decoration: none; border-radius: 999px; font-weight: 700; font-size: 0.9rem; box-shadow: 0 8px 20px rgba(122, 30, 47, 0.35); transition: all 0.2s;" onmouseover="this.style.transform='translateY(-2px)';" onmouseout="this.style.transform='translateY(0)';">
                    홈으로
                </a>
            </div>
        </div>
    </div>

    <style>
        @media (max-height: 700px) {
            body { align-items: flex-start; padding-top: 32px; padding-bottom: 32px; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
